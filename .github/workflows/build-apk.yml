name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "StickmanTribe_Offline_Rebuild_Stage17.zip" ]; then
            unzip -q "StickmanTribe_Offline_Rebuild_Stage17.zip" -d .
          fi
          if [ -d "StickmanTribe_Offline_Rebuild" ]; then
            echo "PROJECT_DIR=StickmanTribe_Offline_Rebuild" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle" ] && [ -d "app" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Project not found. Upload the Stage17 ZIP or project files to the repository root."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StickmanTribe-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
